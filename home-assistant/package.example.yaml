# Exemplo para /config/packages/camera_local.yaml; ajuste os entity_id.
# Ative packages no seu configuration.yaml sem substituir configuracoes existentes.
rest_command:
  camera_local_ptz:
    url: !secret camera_local_ptz_url
    method: POST
    username: !secret camera_local_user
    password: !secret camera_local_password
    authentication: basic
    headers:
      X-Localmod: '1'
    content_type: application/json
    timeout: 10
    payload: '{"direction":"{{ direction }}"}'
  camera_local_light:
    url: !secret camera_local_light_url
    method: POST
    username: !secret camera_local_user
    password: !secret camera_local_password
    authentication: basic
    headers:
      X-Localmod: '1'
    content_type: application/json
    timeout: 10
    payload: '{"action":"{{ mode }}"}'

script:
  camera_local_move:
    alias: Camera local - movimento curto
    mode: single
    max_exceeded: silent
    fields:
      direction:
        required: true
        selector:
          select:
            options: [DirectionUp, DirectionDown, DirectionLeft, DirectionRight]
    sequence:
      - condition: template
        value_template: "{{ direction in ['DirectionUp','DirectionDown','DirectionLeft','DirectionRight'] }}"
      - action: rest_command.camera_local_ptz
        data:
          direction: '{{ direction }}'
        response_variable: result
      - if: "{{ result.status != 200 or result.content.get('Ret', 0) != 100 }}"
        then:
          - stop: Movimento recusado; confira a camera e a parada dos motores
            error: true
  camera_local_light:
    alias: Camera local - LEDs
    mode: queued
    max: 3
    fields:
      mode:
        required: true
        selector:
          select:
            options: [KeepOpen, Close, Auto, Intelligent]
    sequence:
      - condition: template
        value_template: "{{ mode in ['KeepOpen','Close','Auto','Intelligent'] }}"
      - action: rest_command.camera_local_light
        data:
          mode: '{{ mode }}'
        response_variable: result
      - if: "{{ result.status != 200 or result.content.get('Ret', 0) != 100 }}"
        then:
          - stop: Comando de LED recusado pela camera
            error: true
